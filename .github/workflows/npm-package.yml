name: npm package

on:
  pull_request:
    paths:
      - "npm/**"
      - "scripts/build_npm_package.py"
      - "pyproject.toml"
      - "src/**"
      - "config/**"
      - "prompts/**"
      - "assets/**"
      - "search/**"
  push:
    branches: [main]
    paths:
      - "npm/**"
      - "scripts/build_npm_package.py"
      - "pyproject.toml"
      - "src/**"
      - "config/**"
      - "prompts/**"
      - "assets/**"
      - "search/**"
  workflow_dispatch:

jobs:
  launcher-tests:
    name: Node launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test npm/tests/*.test.js

  build-package:
    name: Build npm tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python scripts/build_npm_package.py
      - name: Smoke-test packaged installation
        env:
          DEEPRESEARCH_NPM_RUNTIME_HOME: ${{ runner.temp }}/deepresearch-runtime
        run: |
          npm install --global --prefix "${RUNNER_TEMP}/npm-prefix" ./dist/*.tgz
          "${RUNNER_TEMP}/npm-prefix/bin/deepresearch" --help
      - uses: actions/upload-artifact@v4
        with:
          name: deepresearch-npm-package
          path: |
            dist/*.tgz
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
